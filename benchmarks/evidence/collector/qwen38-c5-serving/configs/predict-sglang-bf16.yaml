# Predictor arm for C5 cell sglang/bf16: the same closed-loop workload the
# runtime bench client sends (isl 8192, osl 128, concurrency 1, 8 requests) at
# the served topology (TP8 / moe_ep_size 8, aggregated).
traffic:
  source: {type: synthetic, input_tokens: 8192, output_tokens: 128}
  load: {type: concurrency, concurrency: 1}
  stop: {requests: 8}
engine:
  model: Qwen/Qwen3.8-Flash-Next
  hardware: h200_sxm
  backend: sglang
  backend_version: "0.5.21"
  context_length: 32768
  mode: aggregated
  workers:
    aggregated:
      parallelism: {replicas: 1, tensor: 8, pipeline: 1, attention_data: 1, moe_tensor: 1, moe_expert: 8}
      scheduler: {max_batched_tokens: 8192, max_sequences: 8}
