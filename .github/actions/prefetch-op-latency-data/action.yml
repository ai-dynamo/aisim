name: Prefetch op-latency data
description: >-
  Make the pinned ai-dynamo/aisim-data op-latency revision available in the data cache and compose the systems
  root, so parallel test workers and later steps start from a warm cache instead of racing to fetch it. Inside Full
  CI the op-latency-data job downloads the dataset once and uploads it as an artifact; this action restores that
  artifact and only downloads from Hugging Face itself when it is missing (a standalone run).

inputs:
  github-env:
    description: Also export AICONFIGURATOR_SYSTEMS_PATH to the rest of the job (for Rust and other native consumers).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore the dataset downloaded once for this run
      # A missing artifact is fine: the next step then downloads the dataset itself.
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: op-latency-data
        path: ${{ runner.temp }}/op-latency-data
    - name: Compose the op-latency systems root
      shell: bash
      env:
        EXPORT_TO_JOB_ENV: ${{ inputs.github-env }}
      run: |
        set -euo pipefail
        python -m pip install --quiet pydantic pyarrow pyyaml huggingface_hub
        archive="${RUNNER_TEMP}/op-latency-data/op-latency-data.tar"
        if [ -f "${archive}" ]; then
          python scripts/ci/op_latency_handoff.py unpack "${archive}"
        fi
        if [ "${EXPORT_TO_JOB_ENV}" = "true" ]; then
          python scripts/ci/compose_systems_root.py --github-env
        else
          python scripts/ci/compose_systems_root.py
        fi
