name: README command checks
on:
  workflow_call:
    inputs:
      daily:
        type: boolean
        default: false
      pr_number:
        description: Verified originating PR number from Full CI target validation
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  commands:
    name: README / ${{ matrix.profile }}
    # Fixed RCs are test dependencies: main seeds the same test-only storage
    # consumed by PRs, without exposing official release storage to PR tokens.
    environment: ${{ matrix.profile == 'dynamo' && 'pr-wheel-staging' || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 'automated-release' || 'pr-wheel-staging') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.daily && '[{"profile":"development","os":"ubuntu-24.04"},{"profile":"release","os":"ubuntu-24.04"},{"profile":"dynamo","os":"ubuntu-24.04"},{"profile":"macos","os":"macos-15"}]' || '[{"profile":"source","os":"ubuntu-24.04"},{"profile":"dynamo","os":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_XET: '1'
      PIP_DEFAULT_TIMEOUT: '60'
      AISIM_RC_REVISION: 77d82652b2f83fd67afefc3141d69a5f06e630be
      DYNAMO_RC_REVISION: 9653d05441b37b6a004837651fd991e44158d755
      RC_PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.0'
      - name: Verify macOS ARM64 coverage
        if: matrix.profile == 'macos'
        run: python -c 'import platform; assert platform.machine() == "arm64"'
      - name: Fetch historical test baseline
        run: git fetch origin d066e918705b98e2d55eed55743ce8d225f129ea
      - name: Install harness dependencies
        run: python -m pip install --require-hashes -r scripts/readme/requirements.txt
      - name: Check harness and reporting contracts
        run: |
          python -m pytest -c /dev/null -p no:cacheprovider scripts/readme/test_readme_commands.py scripts/readme/test_readme_report.py
          python scripts/readme/check_readme_commands.py --validate
      - name: Find matching pinned Dynamo RC wheels
        id: rc-wheels
        if: matrix.profile == 'dynamo'
        env:
          GH_TOKEN: ${{ github.token }}
          RC_STORAGE_REPO: ${{ vars.WHEEL_STORAGE_REPO }}
        run: |
          wheelhouse="${RUNNER_TEMP}/dynamo-rc-wheels"
          echo "AISIM_RC_WHEELHOUSE=${wheelhouse}" >> "${GITHUB_ENV}"
          echo "RC_STORAGE_REPO=${RC_STORAGE_REPO}" >> "${GITHUB_ENV}"
          python scripts/ci/readme_rc_wheels.py prepare --directory "$wheelhouse"
      - name: Restore verified pinned Dynamo RC wheels
        if: matrix.profile == 'dynamo' && steps.rc-wheels.outputs.run-id != ''
        uses: ./.github/actions/wheel-storage
        with:
          mode: download
          name: ${{ steps.rc-wheels.outputs.name }}
          path: ${{ env.AISIM_RC_WHEELHOUSE }}
          run-id: ${{ steps.rc-wheels.outputs.run-id }}
          source-sha: ${{ env.AISIM_RC_REVISION }}
          architecture: amd64
          scope: ${{ steps.rc-wheels.outputs.scope }}
          pr-number: ${{ steps.rc-wheels.outputs.pr-number }}
          url: ${{ vars.WHEEL_STORAGE_URL }}
          repo: ${{ vars.WHEEL_STORAGE_REPO }}
          token: ${{ secrets.ARTIFACTORY_TOKEN }}
      - name: Build the pinned Dynamo RC wheels
        if: matrix.profile == 'dynamo' && steps.rc-wheels.outputs.run-id == ''
        env:
          CARGO_BUILD_JOBS: '2'
        run: bash scripts/ci/build_readme_rc_wheels.sh
      - name: Install RC runtime libraries on reuse
        if: matrix.profile == 'dynamo' && steps.rc-wheels.outputs.run-id != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libhwloc15 libudev1
      - name: Verify the RC wheel set and build inputs
        if: matrix.profile == 'dynamo'
        run: python scripts/ci/readme_rc_wheels.py verify --directory "$AISIM_RC_WHEELHOUSE"
      - name: Execute README commands
        env:
          PROFILE: ${{ matrix.profile }}
        run: >-
          python scripts/readme/check_readme_commands.py
          --profile "$PROFILE"
          --workspace "$RUNNER_TEMP/readme-$PROFILE"
          --output "readme-results/$PROFILE"
      - name: Preserve tested pinned Dynamo RC wheels
        if: matrix.profile == 'dynamo' && steps.rc-wheels.outputs.run-id == ''
        uses: ./.github/actions/wheel-storage
        with:
          mode: upload
          name: ${{ steps.rc-wheels.outputs.name }}
          path: ${{ env.AISIM_RC_WHEELHOUSE }}
          source-sha: ${{ env.AISIM_RC_REVISION }}
          architecture: amd64
          scope: ${{ inputs.pr_number != '' && 'pr' || 'preview' }}
          pr-number: ${{ inputs.pr_number }}
          url: ${{ vars.WHEEL_STORAGE_URL }}
          repo: ${{ vars.WHEEL_STORAGE_REPO }}
          token: ${{ secrets.ARTIFACTORY_TOKEN }}
      - name: Preserve command evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-${{ matrix.profile }}
          path: readme-results/
          if-no-files-found: error
          retention-days: 30
