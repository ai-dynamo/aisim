name: README command checks
on:
  workflow_call:
    inputs:
      daily:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  commands:
    name: README / ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.daily && '[{"profile":"development","os":"ubuntu-24.04"},{"profile":"release","os":"ubuntu-24.04"},{"profile":"dynamo","os":"ubuntu-24.04"},{"profile":"macos","os":"macos-15"}]' || '[{"profile":"source","os":"ubuntu-24.04"},{"profile":"dynamo","os":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_XET: '1'
      PIP_DEFAULT_TIMEOUT: '60'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.0'
      - name: Verify macOS ARM64 coverage
        if: matrix.profile == 'macos'
        run: python -c 'import platform; assert platform.machine() == "arm64"'
      - name: Fetch historical test baseline
        run: git fetch origin d066e918705b98e2d55eed55743ce8d225f129ea
      - name: Install harness dependencies
        run: python -m pip install --require-hashes -r scripts/readme/requirements.txt
      - name: Check harness and reporting contracts
        run: |
          python -m pytest -c /dev/null -p no:cacheprovider scripts/readme/test_readme_commands.py scripts/readme/test_readme_report.py
          python scripts/readme/check_readme_commands.py --validate
      - name: Build the pinned Dynamo RC wheels
        if: matrix.profile == 'dynamo'
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhwloc-dev libudev-dev pkg-config libclang-dev protobuf-compiler cmake
          for entry in aisim:77d82652b2f83fd67afefc3141d69a5f06e630be dynamo:9653d05441b37b6a004837651fd991e44158d755; do
            repo="${entry%%:*}"
            revision="${entry#*:}"
            git init "$RUNNER_TEMP/$repo-rc"
            git -C "$RUNNER_TEMP/$repo-rc" fetch --depth 1 "https://github.com/ai-dynamo/$repo.git" "$revision"
            git -C "$RUNNER_TEMP/$repo-rc" checkout --detach FETCH_HEAD
          done
          wheels="$RUNNER_TEMP/dynamo-rc-wheels"
          uv build --wheel --out-dir "$wheels" --config-setting=build-args=--locked "$RUNNER_TEMP/aisim-rc/python/aisim"
          uv build --wheel --out-dir "$wheels" "$RUNNER_TEMP/dynamo-rc"
          uv build --wheel --out-dir "$wheels" --config-setting='build-args=--locked --features ais-forward-pass' \
            "$RUNNER_TEMP/dynamo-rc/lib/bindings/python"
          echo "AISIM_RC_WHEELHOUSE=$wheels" >> "$GITHUB_ENV"
      - name: Execute README commands
        env:
          PROFILE: ${{ matrix.profile }}
        run: >-
          python scripts/readme/check_readme_commands.py
          --profile "$PROFILE"
          --workspace "$RUNNER_TEMP/readme-$PROFILE"
          --output "readme-results/$PROFILE"
      - name: Preserve command evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-${{ matrix.profile }}
          path: readme-results/
          if-no-files-found: error
          retention-days: 30
