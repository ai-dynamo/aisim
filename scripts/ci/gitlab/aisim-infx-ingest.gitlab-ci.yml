#
# Weekly + manual InferenceX ingestion for the PRIVATE aisim-infx-cache (AISIM-2334, DEP #435).
# DEFINITION ONLY: this file is not registered anywhere. Install it per
# scripts/ci/gitlab/README.md in the internal project `aisim-hf-dataset-ci`.
#
# Guarantees (asserted by tests/unit/data/test_infx_job_definition.py):
#   * runs the library at AISIM_REVIEWED_COMMIT (a full SHA) and nothing else;
#   * only `publish_candidate` and `promote` see the scoped cache token;
#   * an unchanged refresh makes no commit; a candidate goes to a candidate/* branch, never the default branch;
#   * promotion is manual and needs a named reviewer; failures never touch the last qualified snapshot;
#   * failures and staleness alert Slack #swdl-dynamo-aisim-daily and the owner (Simone Chen) by email.

spec:
  inputs:
    job:
      description: Which reviewed job to run
      default: ingest
      options: [ingest, promote, staleness]
    candidate-snapshot-id:
      description: Snapshot to qualify (required for promote)
      default: ""
      regex: '^([0-9a-f]{64})?$'
    candidate-generation:
      description: Job ID suffix of the candidate branch (empty for legacy branches)
      default: ""
      regex: '^[0-9]*$'
---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages: [ingest, promote, staleness, notify]

variables:
  # Required, set as protected CI/CD variables (changed only through a reviewed MR to this project):
  #   AISIM_REVIEWED_COMMIT   40-hex commit of ai-dynamo/aisim that was code-reviewed
  #   AISIM_REPO_URL          fetch URL for that repository (read-only)
  #   INFX_CACHE_REPO_URL     git URL of the private aisim-infx-cache repository
  #   INFX_CACHE_READ_TOKEN   read-only token on aisim-infx-cache (masked, protected)
  #   INFX_CACHE_WRITE_TOKEN  write on aisim-infx-cache ONLY; environment scope infx-cache-writer
  #                           (masked, protected; never use the default '*' environment scope)
  #   SLACK_WEBHOOK_URL       incoming webhook for #swdl-dynamo-aisim-daily (masked, protected)
  #   SMTP_HOST, SMTP_FROM, AISIM_JOB_OWNER_EMAIL   owner email alerts (owner: Simone Chen)
  GIT_STRATEGY: empty  # a clean build directory for every job, even on a runner that reuses workspaces
  GIT_TERMINAL_PROMPT: "0"
  INFX_JOB: $[[ inputs.job ]]

.pinned:
  before_script:
    - |
      set -eu
      case "$AISIM_REVIEWED_COMMIT" in
        *[!0-9a-f]*|"") echo "AISIM_REVIEWED_COMMIT must be a lowercase hex SHA" >&2; exit 2 ;;
      esac
      test "${#AISIM_REVIEWED_COMMIT}" -eq 40 || { echo "AISIM_REVIEWED_COMMIT must be 40 hex chars" >&2; exit 2; }
      rm -rf aisim && mkdir aisim && cd aisim
      git init -q && git remote add origin "$AISIM_REPO_URL"
      git fetch -q --depth 1 origin "$AISIM_REVIEWED_COMMIT"
      git checkout -q --detach FETCH_HEAD
      test "$(git rev-parse HEAD)" = "$AISIM_REVIEWED_COMMIT"
      env -u INFX_CACHE_WRITE_TOKEN uv sync --project python/aisim --frozen
      cd "$CI_PROJECT_DIR"
  variables:
    JOB_PY: "uv run --frozen --project aisim/python/aisim python -m aisim_core.data.infx_job"

# Clone helper: the token is passed as a one-shot header and never written to the clone's config.
.cache_clone: &cache_clone |
  git -c http.extraHeader="Authorization: Bearer ${INFX_CACHE_WRITE_TOKEN}" clone -q --depth 1 "$INFX_CACHE_REPO_URL" cache-repo

.cache_read_clone: &cache_read_clone |
  git -c http.extraHeader="Authorization: Bearer ${INFX_CACHE_READ_TOKEN}" clone -q --depth 1 "$INFX_CACHE_REPO_URL" cache-repo

publish_candidate:
  stage: ingest
  resource_group: infx-cache-candidate-publication
  extends: .pinned
  environment:
    name: infx-cache-writer
    action: access
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $INFX_JOB == "ingest"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $INFX_JOB == "ingest"'
  script:
    - set -eu
    - *cache_clone
    # Acquisition is public and needs no credential; the token is only used by git below.
    - env -u INFX_CACHE_WRITE_TOKEN $JOB_PY run --no-notify --root cache-repo --cache-dir "$CI_PROJECT_DIR/infx-acquisition" --report run-report.json
    - |
      cd cache-repo
      STATUS=$(git status --porcelain) || exit "$?"
      if [ -z "$STATUS" ]; then echo "unchanged refresh: no commit, no snapshot"; exit 0; fi
      SID=$(python3 -c "import json;print(json.load(open('../run-report.json'))['snapshot_id'])")
      # A branch is reusable only while this exact snapshot is pending against
      # the current qualification. Historical reviews stay untouched.
      git -c http.extraHeader="Authorization: Bearer ${INFX_CACHE_WRITE_TOKEN}" ls-remote --heads origin "candidate/${SID}" "candidate/${SID}-*" > ../candidate-refs
      while read -r REV REF; do
        git -c http.extraHeader="Authorization: Bearer ${INFX_CACHE_WRITE_TOKEN}" fetch -q --depth 1 origin "$REF"
        git worktree add -q --detach ../remote-candidate FETCH_HEAD
        RC=0
        env -u INFX_CACHE_WRITE_TOKEN uv run --frozen --project ../aisim/python/aisim python - <<'PY' || RC=$?
      import sys
      from pathlib import Path

      from aisim_core.data.e2e import read_snapshot, verify_snapshot_members
      from aisim_core.data.infx_job import load_state

      NOT_REUSABLE = 3  # the only exit code that allows publishing a replacement
      remote_root = Path("../remote-candidate")
      try:
          current = load_state(Path("."))
          remote = load_state(remote_root)
          pending = remote.get("candidate")
          same = (
              remote.get("qualified") == current["qualified"]
              and isinstance(pending, dict)
              and all(pending.get(k) == current["candidate"][k] for k in ("snapshot_id", "snapshot_path"))
          )
          if not same:
              sys.exit(NOT_REUSABLE)
          snapshot, members = read_snapshot(remote_root, pending["snapshot_path"])
          if snapshot.snapshot_id != pending["snapshot_id"] or snapshot.completeness != "complete":
              sys.exit(NOT_REUSABLE)
          verify_snapshot_members(remote_root, members)
      except (OSError, ValueError, RecursionError) as exc:
          print(f"pending branch is not reusable: {type(exc).__name__}: {exc}", file=sys.stderr)
          sys.exit(NOT_REUSABLE)
      PY
        git worktree remove ../remote-candidate
        if [ "$RC" -eq 0 ]; then
          echo "${REF#refs/heads/} is pending for this baseline: nothing to push"; exit 0
        fi
        # Exit 3 is the verifier's verdict that this branch is not reusable. Any other
        # failure (launcher, interpreter, crash) says nothing about the branch: stop.
        if [ "$RC" -ne 3 ]; then echo "candidate verifier failed to run (exit ${RC}); not publishing" >&2; exit "$RC"; fi
      done < ../candidate-refs
      # A retried job keeps its pipeline ID but gets a new job ID, so the job ID keeps each attempt's ref unique.
      case "$CI_JOB_ID" in *[!0-9]*|"") echo "numeric CI_JOB_ID required" >&2; exit 2 ;; esac
      BRANCH="candidate/${SID}-${CI_JOB_ID}"
      git checkout -q -b "$BRANCH"
      git add -A
      git -c user.name="aisim-infx-ingest" -c user.email="noreply@nvidia.com" commit -q -m "candidate: InferenceX snapshot ${SID} (not qualified)"
      git -c http.extraHeader="Authorization: Bearer ${INFX_CACHE_WRITE_TOKEN}" push -q origin "$BRANCH"
      echo "Review ${BRANCH}; promote with candidate-snapshot-id=${SID} and candidate-generation=${CI_JOB_ID}"
  cache:
    key: infx-acquisition
    paths: [infx-acquisition/]
  artifacts:
    when: always
    paths: [run-report.json]
    expire_in: 30 days
  timeout: 3h
  retry: 0

promote:
  stage: promote
  extends: .pinned
  environment:
    name: infx-cache-writer
    action: access
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $INFX_JOB == "promote"'
      when: manual
  allow_failure: false
  script:
    - set -eu
    - 'test -n "$[[ inputs.candidate-snapshot-id ]]" || { echo "set the candidate-snapshot-id input" >&2; exit 2; }'
    - |
      BRANCH="candidate/$[[ inputs.candidate-snapshot-id ]]"
      GENERATION="$[[ inputs.candidate-generation ]]"
      if [ -n "$GENERATION" ]; then BRANCH="${BRANCH}-${GENERATION}"; fi
      git -c http.extraHeader="Authorization: Bearer ${INFX_CACHE_WRITE_TOKEN}" clone -q --depth 1 --branch "$BRANCH" "$INFX_CACHE_REPO_URL" cache-repo
    - env -u INFX_CACHE_WRITE_TOKEN $JOB_PY promote --root cache-repo --snapshot-id "$[[ inputs.candidate-snapshot-id ]]" --reviewer "$GITLAB_USER_NAME"
    - |
      cd cache-repo
      git -c user.name="aisim-infx-ingest" -c user.email="noreply@nvidia.com" commit -qam "qualify: $[[ inputs.candidate-snapshot-id ]] (reviewer ${GITLAB_USER_NAME})"
      git -c http.extraHeader="Authorization: Bearer ${INFX_CACHE_WRITE_TOKEN}" push -q origin "HEAD:refs/heads/${BRANCH}"
    # Merging the candidate branch into the default branch stays a reviewed merge request, not this job.

staleness:
  stage: staleness
  extends: .pinned
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $INFX_JOB == "staleness"'
  script:
    - set -eu
    - *cache_read_clone
    # Alert only: exit 10 = warn (>= 8 days), 11 = stale (>= 14 days) since the last qualified snapshot.
    - $JOB_PY staleness --root cache-repo
  allow_failure:
    exit_codes: [10, 11]

alert_failure:
  stage: notify
  when: on_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $INFX_JOB == "ingest"'
      when: on_failure
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $INFX_JOB == "staleness"'
      when: on_failure
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_failure
  script:
    # Standard library only: alerts still run if fetching or installing AISim failed.
    - |
      python3 - <<'PY'
      import json
      import os
      import smtplib
      import sys
      import urllib.request
      from email.message import EmailMessage

      text = "pipeline " + os.environ["CI_PIPELINE_URL"] + "; last qualified snapshot retained"
      try:
          with open("run-report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          if report.get("error"):
              text += "\nIngestion error: " + str(report["error"])
      except (OSError, ValueError):
          pass  # setup failures may happen before a report can be written
      failures = []
      try:
          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              json.dumps({"channel": "#swdl-dynamo-aisim-daily", "text": text}).encode(),
              {"Content-Type": "application/json"},
          )
          urllib.request.urlopen(request, timeout=30).close()
      except Exception:
          failures.append("Slack notification failed")
      try:
          message = EmailMessage()
          message["From"] = os.environ["SMTP_FROM"]
          message["To"] = os.environ["AISIM_JOB_OWNER_EMAIL"]
          message["Subject"] = "AISim InferenceX job failed"
          message.set_content(text)
          with smtplib.SMTP(os.environ["SMTP_HOST"], timeout=30) as smtp:
              smtp.send_message(message)
      except Exception:
          failures.append("Email notification failed")
      for failure in failures:
          print(failure, file=sys.stderr)
      sys.exit(1 if failures else 0)
      PY
